[project]
name = "strate"
version = "0.1.0"
description = "Terminal open source d'alternative data : satellite, attention publique et convergence de signaux sur les mines."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "planetary-computer>=1.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
strate = "strate.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
